# Build and publish the Quality Guard sidecar image.
#
# Publishes ghcr.io/<owner>/<repo>/quality-guard with tags:
#   latest      - newest build from the default branch
#   sha-<short> - pinned build, use this in compose for reproducibility
#   vX.Y.Z      - when pushed as a git tag
#
# The image is a drop-in for the official tools/egress-quality-guard build, so
# compose only needs an image reference:
#
#   egress-quality-guard:
#     image: ghcr.io/<owner>/<repo>/quality-guard:latest
#     environment:
#       GROK2API_BASE_URL: http://grok2api:8000
#     volumes:
#       - quality_guard_state:/var/lib/grok2api-quality-guard

name: quality-guard image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "sidecar/quality_guard.py"
      - "sidecar/Dockerfile"
      - ".github/workflows/quality-guard-image.yml"
  pull_request:
    paths:
      - "sidecar/quality_guard.py"
      - "sidecar/Dockerfile"
      - ".github/workflows/quality-guard-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/quality-guard

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Source checks
        shell: bash
        run: |
          set -euo pipefail
          f=sidecar/quality_guard.py
          test -s "$f"
          # The image installs no packages; a third-party import would break it.
          if grep -nE '^\s*(import|from)\s+(requests|httpx|aiohttp|yaml|bs4|pydantic)\b' "$f"; then
            echo "::error::non-stdlib import found; the image has no pip dependencies"
            exit 1
          fi
          python3 -m py_compile "$f"
          # Upstream internal-API contract must be intact.
          grep -q 'INTERNAL_API_PREFIX = "/api/internal/v1/quality-guard"' "$f" \
            || { echo "::error::internal API prefix changed"; exit 1; }
          grep -q 'bootstrap.json' "$f" \
            || { echo "::error::bootstrap contract missing"; exit 1; }
          grep -q 'GROK2API_BASE_URL' "$f" \
            || { echo "::error::base URL override missing"; exit 1; }
          echo "source ok: $(stat -c%s "$f") bytes"

      - name: Import check
        shell: bash
        run: |
          set -euo pipefail
          cd sidecar
          python3 -c "import ast,sys; ast.parse(open('quality_guard.py',encoding='utf-8').read()); print('AST ok')"

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sidecar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          img=$(printf '%s\n' "$TAGS" | head -n1)
          echo "testing $img"
          docker pull "$img"

          # No bootstrap.json (the realistic "grok2api not ready yet" case):
          # the guard must exit with a clear message, not crash or hang.
          out=$(docker run --rm "$img" 2>&1 || true)
          echo "$out"
          case "$out" in
            *"bootstrap"*) echo "smoke ok: missing bootstrap reported cleanly" ;;
            *) echo "::error::unexpected startup output"; exit 1 ;;
          esac

          # A synthetic bootstrap must be accepted and produce a valid config.
          tmp=$(mktemp -d)
          cat > "$tmp/bootstrap.json" <<'JSON'
          {
            "version": 1,
            "enabled": true,
            "internal_token": "smoke-token",
            "config": {
              "model": "grok-4.6",
              "mode": "passive",
              "active_interval_seconds": 1800,
              "passive_poll_seconds": 5,
              "soft_tps": 500,
              "hard_tps": 1000,
              "consecutive_soft": 2,
              "consecutive_errors": 2,
              "quarantine_seconds": 300,
              "no_account_backoff_seconds": 300,
              "min_healthy_nodes": 1,
              "max_output_tokens": 384,
              "fail_closed": false,
              "min_generation_ms": 1000,
              "prompt": "reply with QUALITY_OK",
              "expected": "QUALITY_OK"
            }
          }
          JSON
          out=$(docker run --rm \
                  -v "$tmp:/var/lib/grok2api-quality-guard:ro" \
                  "$img" --check-config 2>&1 || true)
          echo "$out"
          case "$out" in
            *"configuration is valid"*) echo "smoke ok: bootstrap accepted" ;;
            *) echo "::error::image rejected a valid bootstrap"; exit 1 ;;
          esac
