# Build and publish the Quality Guard sidecar image.
#
# Publishes ghcr.io/<owner>/<repo>/quality-guard for linux/amd64 and linux/arm64:
#   latest      - newest build from the default branch
#   sha-<short> - pinned build, use this in compose for reproducibility
#   vX.Y.Z      - when pushed as a git tag
#
# The image is a drop-in for the official tools/egress-quality-guard build, so
# compose only needs an image reference:
#
#   egress-quality-guard:
#     image: ghcr.io/<owner>/<repo>/quality-guard:latest
#     environment:
#       GROK2API_BASE_URL: http://grok2api:8000
#     volumes:
#       - quality_guard_state:/var/lib/grok2api-quality-guard

name: quality-guard image

on:
  push:
    branches:
      - main
    tags:
      - "quality-guard-v*"
      - "v*"
    paths:
      - "sidecar/quality_guard.py"
      - "sidecar/quality_guard_test.py"
      - "sidecar/Dockerfile"
      - ".github/workflows/quality-guard-image.yml"
  pull_request:
    paths:
      - "sidecar/quality_guard.py"
      - "sidecar/quality_guard_test.py"
      - "sidecar/Dockerfile"
      - ".github/workflows/quality-guard-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/quality-guard

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run classifier tests
        run: python sidecar/quality_guard_test.py

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=v(.*),group=1
            type=match,pattern=quality-guard-v(.*),group=1
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sidecar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report published tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Published:"
          printf '%s\n' "$TAGS" | sed 's/^/  /'
